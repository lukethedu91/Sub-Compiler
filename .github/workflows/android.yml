name: Android

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a build.log

      # Kotlin/KSP diagnostics scroll far above the Gradle stack trace, so
      # repeat them at the end of the job where they are easy to find.
      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "=== errors and failing tasks ==="
          grep -E "^(e|w): |^error: |FAILED|Execution failed" build.log | head -100 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookend-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Keeps a directly installable APK behind a stable URL:
      # https://github.com/<owner>/<repo>/releases/download/dev/bookend-debug.apk
      - name: Publish debug APK to the dev release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bookend-debug.apk
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev bookend-debug.apk \
            --prerelease \
            --title "Bookend (debug build)" \
            --notes "Debug build of ${GITHUB_SHA}. Signed with a throwaway debug key, so uninstall any previous copy before installing a newer one."
